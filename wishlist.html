<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Wishlist | LushLocks</title>
  <!-- Font Awesome 6 (free) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    /* ----- RESET & BASE ----- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      
    }

    body {
      font-family: 'Segoe UI', Roboto, Arial, sans-serif;
      background: #f6f3ed;
      color: #1e2e24;
      padding-top: 90px;         /* space for fixed navbar */
      transition: padding-top 0.2s;
    }

    /* ----- FIXED NAVBAR (fully responsive) ----- */
    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      background: #ffffff;
      padding: 14px 6%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      box-shadow: 0 4px 18px rgba(0, 20, 10, 0.06);
      z-index: 1000;
      transition: all 0.25s ease;
      gap: 10px 12px;
    }

    .logo {
      font-size: 28px;
      font-weight: 700;
      color: #263d2b;
      text-decoration: none;
      letter-spacing: -0.3px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .logo span { color: #6f8f6a; }
    .logo i { color: #4b6e47; }

    /* ----- toggle button (hamburger) ----- */
    .nav-toggle {
      display: none;            /* hidden on large screens */
      background: transparent;
      border: none;
      font-size: 28px;
      color: #263d2b;
      cursor: pointer;
      padding: 4px 8px;
      transition: 0.2s;
      line-height: 1;
    }
    .nav-toggle:hover {
      color: #4b6e47;
      transform: scale(1.02);
    }

    /* right side wrapper — collapsible on mobile */
    .navbar-right {
      display: flex;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
      transition: all 0.25s ease;
    }

    .nav-icons {
      display: flex;
      align-items: center;
      gap: 18px;
    }
    .nav-icons a {
      position: relative;
      color: #263d2b;
      font-size: 22px;
      text-decoration: none;
      transition: 0.2s;
      line-height: 1;
    }
    .nav-icons a:hover {
      color: #4b6e47;
      transform: translateY(-2px);
    }
    .nav-icons a.active-icon {
      color: #4b6e47 !important;
    }

    .cart-count {
      position: absolute;
      top: -10px;
      right: -12px;
      background: #4b6e47;
      color: #fff;
      font-size: 11px;
      font-weight: 600;
      width: 20px;
      height: 20px;
      border-radius: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    .back-btn {
      text-decoration: none;
      color: #1e2e24;
      border: 1.5px solid #6f8f6a;
      padding: 8px 18px;
      border-radius: 40px;
      font-weight: 600;
      font-size: 0.95rem;
      transition: 0.25s;
      background: transparent;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }
    .back-btn:hover {
      background: #4b6e47;
      color: #fff;
      border-color: #4b6e47;
    }

    /* ----- container & wishlist grid ----- */
    .container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 24px 30px;
    }

    h1 {
      text-align: center;
      font-weight: 500;
      font-size: 2.2rem;
      letter-spacing: -0.5px;
      color: #1e2e24;
      margin: 8px 0 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }
    h1 i { color: #b34a4a; font-size: 2rem; }

    .wishlist-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 30px 25px;
    }

    .wishlist-card {
      background: #ffffff;
      padding: 22px 16px 20px;
      border-radius: 24px;
      text-align: center;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.04);
      border: 1px solid #eeebe4;
      transition: 0.2s;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .wishlist-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 14px 34px rgba(60, 80, 60, 0.08);
    }
    .wishlist-card img {
      width: 160px;
      height: 190px;
      object-fit: contain;
      margin-bottom: 8px;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.02));
    }
    .wishlist-card h3 {
      font-size: 1.15rem;
      font-weight: 600;
      margin: 8px 0 4px;
      color: #1e2e24;
    }
    .price {
      font-size: 1.4rem;
      font-weight: 700;
      color: #3a6042;
      margin: 6px 0 16px;
      letter-spacing: -0.3px;
    }

    .btn {
      border: none;
      padding: 10px 16px;
      border-radius: 40px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      margin: 4px 4px;
      transition: 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .cart-btn {
      background: #4b6e47;
      color: white;
      box-shadow: 0 2px 8px rgba(65, 95, 65, 0.15);
    }
    .cart-btn:hover { background: #3a5a3a; transform: scale(0.97); }
    .remove-btn {
      background: #f1eeea;
      color: #a1463d;
    }
    .remove-btn:hover { background: #e5dbd6; }

    .empty {
      text-align: center;
      font-size: 1.6rem;
      padding: 70px 20px;
      color: #4f5f4a;
      background: #fcfaf7;
      border-radius: 60px;
      grid-column: 1 / -1;
    }
    .empty i { font-size: 3.4rem; color: #bc8f8a; }

    /* ----- FOOTER (simple, consistent) ----- */
    .simple-footer {
      margin-top: 70px;
      background: #263d2b;
      color: #f0f3ec;
      padding: 40px 6% 20px;
    }
    .footer-content {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 25px;
    }
    .footer-brand h2 {
      font-size: 1.8rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .footer-brand span { color: #b6d0aa; }
    .footer-brand p {
      color: #d4dfce;
      margin-top: 6px;
      font-size: 0.95rem;
    }
    .footer-menu {
      display: flex;
      gap: 22px;
      flex-wrap: wrap;
    }
    .footer-menu a {
      color: #eef3ea;
      text-decoration: none;
      font-weight: 500;
      transition: 0.2s;
    }
    .footer-menu a:hover { color: #c7dec0; }
    .footer-social {
      display: flex;
      gap: 12px;
    }
    .footer-social a {
      width: 42px;
      height: 42px;
      border-radius: 60px;
      border: 1.5px solid #aac09f;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #f0f3ec;
      text-decoration: none;
      transition: 0.2s;
      font-size: 1.2rem;
    }
    .footer-social a:hover {
      background: #aac09f;
      color: #1e2e24;
    }
    .footer-line {
      margin: 28px 0 16px;
      border: 0;
      border-top: 1.5px solid rgba(200, 215, 185, 0.25);
    }
    .footer-bottom {
      text-align: center;
      font-size: 0.9rem;
      color: #cfddc8;
    }

    /* =============================================
       RESPONSIVE BREAKPOINTS (toggle + navbar)
    ============================================= */

    /* ----- tablet & smaller: show toggle, hide menu by default ----- */
    @media (max-width: 820px) {
      .nav-toggle {
        display: inline-block;    /* show hamburger */
        order: 2;
      }

      .navbar {
        padding: 12px 5%;
        flex-wrap: wrap;
      }

      .logo {
        order: 1;
        flex: 1;
      }

      .navbar-right {
        order: 3;
        width: 100%;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        max-height: 0;
        overflow: hidden;
        padding: 0 6px;
        opacity: 0;
        transition: max-height 0.35s ease, opacity 0.3s ease, padding 0.2s;
        border-top: 0px solid transparent;
        pointer-events: none;     /* prevent clicks when hidden */
      }

      /* when toggled open */
      .navbar-right.open {
        max-height: 460px;        /* enough for all items */
        padding: 18px 6px 8px;
        opacity: 1;
        border-top: 1.5px solid #e2e8dd;
        pointer-events: auto;
      }

      .nav-icons {
        flex-wrap: wrap;
        justify-content: center;
        gap: 22px 24px;
        width: 100%;
      }
      .nav-icons a {
        font-size: 26px;
      }

      .back-btn {
        width: 100%;
        max-width: 260px;
        justify-content: center;
        padding: 10px 16px;
        font-size: 1rem;
      }

      body {
        padding-top: 100px;
      }

      .container {
        padding: 0 16px 20px;
      }
      h1 {
        font-size: 2rem;
        margin-bottom: 28px;
      }
      .wishlist-container {
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        gap: 20px;
      }
      .footer-content {
        flex-direction: column;
        text-align: center;
      }
      .footer-menu {
        justify-content: center;
      }
    }

    /* ----- small phones ----- */
    @media (max-width: 480px) {
      body { padding-top: 110px; }
      .navbar { padding: 10px 4%; }
      .logo { font-size: 24px; }
      .nav-toggle { font-size: 26px; }
      .nav-icons a { font-size: 24px; }
      .navbar-right.open { max-height: 500px; }

      .wishlist-container {
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }
      .wishlist-card {
        padding: 14px 8px;
      }
      .wishlist-card img {
        width: 120px;
        height: 150px;
      }
      .price { font-size: 1.2rem; }
      .btn {
        padding: 7px 10px;
        font-size: 0.75rem;
      }
      .cart-count {
        width: 18px;
        height: 18px;
        font-size: 10px;
        top: -8px;
        right: -10px;
      }
    }

    /* extra tiny (<= 380px) */
    @media (max-width: 380px) {
      .wishlist-container {
        grid-template-columns: 1fr;
        max-width: 300px;
        margin: 0 auto;
      }
      .nav-icons a { font-size: 20px; }
    }

    /* large screens: toggle hidden, menu always visible */
    @media (min-width: 821px) {
      .nav-toggle {
        display: none !important;
      }
      .navbar-right {
        display: flex !important;
        max-height: none !important;
        opacity: 1 !important;
        overflow: visible !important;
        padding: 0 !important;
        border-top: none !important;
        pointer-events: auto !important;
        flex-direction: row !important;
        width: auto !important;
      }
      .nav-icons {
        width: auto !important;
        flex-wrap: nowrap !important;
      }
      .back-btn {
        width: auto !important;
        max-width: none !important;
      }
    }
    .empty-wishlist{
    text-align:center;
    padding:80px 20px;
}

.empty-wishlist i{
    font-size:70px;
    color:#c94b4b;
    margin-bottom:20px;
}

.empty-wishlist h2{
    color:#2f4f2f;
    margin-bottom:10px;
}

.empty-wishlist p{
    color:#666;
    margin-bottom:20px;
}

.shop-btn{
    display:inline-block;
    padding:12px 25px;
    background:#4f7a4f;
    color:#fff;
    text-decoration:none;
    border-radius:30px;
}

.shop-btn:hover{
    background:#355c35;
}

    /* small helper */
    .fa-heart, .fa-cart-shopping { pointer-events: none; }
  </style>
</head>
<body>

  <!-- ============ FIXED NAVBAR with TOGGLE ============ -->
  <nav class="navbar">
    <!-- logo -->
    <a href="index.html" class="logo">
      <i class="fas fa-leaf"></i> Lush<span>Locks</span>
    </a>

    <!-- TOGGLE BUTTON (hamburger) -->
    <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation">
      <i class="fas fa-bars"></i>
    </button>

    <!-- right side (collapsible) -->
    <div class="navbar-right" id="navbarRight">
      <div class="nav-icons">
        <a href="index.html" title="Home"><i class="fas fa-home"></i></a>
        <a href="wishlist.html" class="active-icon" title="Wishlist"><i class="fas fa-heart"></i></a>
        <a href="cart.html" title="Cart">
          <i class="fas fa-shopping-cart"></i>
          <span id="cartCount" class="cart-count">0</span>
        </a>
        
      </div>

      <a href="index.html" class="back-btn">
        <i class="fas fa-arrow-left"></i> Continue Shopping
      </a>
    </div>
  </nav>

  <!-- ============ MAIN CONTENT ============ -->
  <div class="container">
    <h1><i class="fas fa-heart"></i> My Wishlist</h1>
    <div id="wishlistContainer" class="wishlist-container"></div>
  </div>

  <!-- ============ FOOTER ============ -->
  <footer class="simple-footer">
    <div class="footer-content">
      <div class="footer-brand">
        <h2><i class="fas fa-leaf"></i> Lush<span>Locks</span></h2>
        <p>Natural care for beautiful, healthy hair.</p>
      </div>
      <div class="footer-menu">
        <a href="index.html">Home</a>
        <a href="wishlist.html">Wishlist</a>
        <a href="cart.html">Cart</a>
        <a href="index.html#contact">Contact</a>
      </div>
      <div class="footer-social">
        <a href="#"><i class="fab fa-facebook-f"></i></a>
        <a href="#"><i class="fab fa-instagram"></i></a>
        <a href="#"><i class="fab fa-youtube"></i></a>
        <a href="#"><i class="fab fa-whatsapp"></i></a>
      </div>
    </div>
    <hr class="footer-line" />
    <div class="footer-bottom">© 2026 LushLocks | All Rights Reserved</div>
  </footer>

  <script>
    (function () {

  // ----- TOGGLE functionality -----
  const toggleBtn = document.getElementById("navToggle");
  const navbarRight = document.getElementById("navbarRight");

  if (toggleBtn && navbarRight) {

    toggleBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      navbarRight.classList.toggle("open");

      const icon = toggleBtn.querySelector("i");
      icon.className = navbarRight.classList.contains("open")
        ? "fas fa-times"
        : "fas fa-bars";
    });

    document.addEventListener("click", function (e) {
      if (
        !navbarRight.contains(e.target) &&
        !toggleBtn.contains(e.target)
      ) {
        navbarRight.classList.remove("open");
        toggleBtn.querySelector("i").className = "fas fa-bars";
      }
    });

    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape") {
        navbarRight.classList.remove("open");
        toggleBtn.querySelector("i").className = "fas fa-bars";
      }
    });

  }

  // ----- Cart Badge -----
  function updateCartBadge() {
    let cart = JSON.parse(localStorage.getItem("cart")) || [];
    let total = cart.reduce((sum, item) => sum + (item.quantity || 1), 0);
    document.getElementById("cartCount").textContent = total;
  }

  // ----- Display Wishlist -----
  function displayWishlist() {

    const wishlist = JSON.parse(localStorage.getItem("wishlist")) || [];
    const container = document.getElementById("wishlistContainer");

    if (wishlist.length === 0) {

      container.innerHTML = `
        <div class="empty-wishlist">
            <i class="fa-solid fa-heart-crack"></i>
            <h2>Your Wishlist is Empty</h2>
            <p>Add your favourite products to the wishlist.</p>
           
        </div>
      `;

      updateCartBadge();
      return;
    }

    let html = "";

    wishlist.forEach((product, index) => {

      html += `
      <div class="wishlist-card">

          <img src="${product.image}" alt="${product.name}">

          <h3>${product.name}</h3>

          <div class="price">₹${product.price}</div>

          <button class="btn cart-btn"
            onclick="moveToCart(${index})">
            <i class="fas fa-cart-shopping"></i>
            Add to Cart
          </button>

          <button class="btn remove-btn"
            onclick="removeWishlist(${index})">
            <i class="fas fa-trash"></i>
            Remove
          </button>

      </div>
      `;
    });

    container.innerHTML = html;

    updateCartBadge();

  }

  // ----- Remove Wishlist -----
  window.removeWishlist = function (index) {

    let wishlist = JSON.parse(localStorage.getItem("wishlist")) || [];

    wishlist.splice(index, 1);

    localStorage.setItem("wishlist", JSON.stringify(wishlist));

    displayWishlist();

  };

  // ----- Move To Cart -----
  window.moveToCart = function (index) {

    let wishlist = JSON.parse(localStorage.getItem("wishlist")) || [];

    let cart = JSON.parse(localStorage.getItem("cart")) || [];

    let product = wishlist[index];

    let existing = cart.find(item => item.name === product.name);

    if (existing) {

      existing.quantity = (existing.quantity || 1) + 1;

    } else {

      cart.push({
        name: product.name,
        price: product.price,
        image: product.image,
        quantity: 1
      });

    }

    localStorage.setItem("cart", JSON.stringify(cart));

    wishlist.splice(index, 1);

    localStorage.setItem("wishlist", JSON.stringify(wishlist));

    displayWishlist();

    alert("🛒 Product moved to Cart!");

  };

  // ----- Page Load -----
  document.addEventListener("DOMContentLoaded", function () {

    if (!localStorage.getItem("wishlist")) {
      localStorage.setItem("wishlist", JSON.stringify([]));
    }

    if (!localStorage.getItem("cart")) {
      localStorage.setItem("cart", JSON.stringify([]));
    }

    displayWishlist();

    updateCartBadge();

  });

  // ----- Sync -----
  window.addEventListener("storage", function () {

    displayWishlist();

    updateCartBadge();

  });

})();
  </script>
</body>
</html>
